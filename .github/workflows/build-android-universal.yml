---
name: build-android-universal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to auto-increment patched-v<major>.<minor>.N)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "android/app/src/main/res/raw/**"
      - "android/app/src/main/res/xml/network_security_config.xml"
      - "android/app/src/main/assets/trusted-cas/**"
      - "patches/**"
      - ".github/workflows/build-android-universal.yml"

concurrency:
  group: build-android-universal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TERM: xterm
  NODE_OPTIONS: --max-old-space-size=8192
  ORG_GRADLE_PROJECT_jvmargs: -Xmx6g -XX:+HeapDumpOnOutOfMemoryError

jobs:
  build-android-universal:
    name: Universal APK (armv7 + armv8)
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: ci/verify-source-ca
        shell: bash
        run: |
          ls -la android/app/src/main/res/raw/
          openssl x509 -in android/app/src/main/res/raw/russian_trusted_root_ca.pem -noout -subject -fingerprint -sha256
          ls -la android/app/src/main/assets/trusted-cas/
          openssl x509 -in android/app/src/main/assets/trusted-cas/russian_trusted_root_ca.pem -noout -subject -fingerprint -sha256

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      - name: ci/verify-library-patch
        shell: bash
        run: |
          TM="node_modules/@mattermost/react-native-network-client/android/src/main/java/com/mattermost/networkclient/helpers/TrustManagerHelper.kt"
          ls -la "$TM"
          grep -q "buildBundledTrustManager" "$TM" || { echo "ERROR: TrustManagerHelper patch not applied"; exit 1; }
          grep -q "CompositeTrustManager" "$TM" || { echo "ERROR: CompositeTrustManager missing"; exit 1; }
          grep -q "buildTrustManager(context)" node_modules/@mattermost/react-native-network-client/android/src/main/java/com/mattermost/networkclient/NetworkClient.kt || { echo "ERROR: NetworkClient patch not applied"; exit 1; }
          echo "Library patch verified"

      - name: ci/setup-java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: ci/jetify-android-libraries
        shell: bash
        run: ./node_modules/.bin/jetify

      - name: ci/copy-sound-assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/* android/app/src/main/res/raw/
          ls -la android/app/src/main/res/raw/

      - name: ci/free-disk-space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: ci/install-android-sdk-components
        shell: bash
        run: |
          SDKMGR="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"; do
            installed=""
            for attempt in 1 2 3 4 5; do
              echo "::group::sdkmanager $pkg (attempt $attempt)"
              if "$SDKMGR" "$pkg"; then installed=1; echo "::endgroup::"; break; fi
              echo "::endgroup::"
              sleep 15
            done
            if [ -z "$installed" ]; then echo "Failed to install $pkg"; exit 1; fi
          done
          ls -la "${ANDROID_HOME}/ndk" || true

      - name: ci/cache-gradle-dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /home/runner/.gradle/caches/modules-2/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: ci/build-universal-release-apk
        shell: bash
        working-directory: ./android
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PseparateApk=true \
            -PuniversalApk=true \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: ci/upload-apks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mattermost-android-universal-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-universal-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: ci/verify-bundled-ca
        shell: bash
        working-directory: ./android/app/build/outputs/apk/release
        run: |
          ls -lh
          python3 - <<'PY'
          import zipfile, sys
          apk = 'app-universal-release.apk'
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          raw = [n for n in names if '/raw/' in n]
          certs = [n for n in names if n.lower().endswith(('.pem', '.crt', '.cer', '.der'))]
          print('raw entries:', raw)
          print('cert-like entries:', certs)
          asset = 'assets/trusted-cas/russian_trusted_root_ca.pem'
          if asset not in names:
              print('ERROR: bundled trust anchor asset missing from APK:', asset)
              sys.exit(1)
          with open('/tmp/bundled_ca.pem', 'wb') as f:
              f.write(z.read(asset))
          print('extracted certificate from:', asset)
          dex = b''.join(z.read(n) for n in names if n.endswith('.dex'))
          for token in (b'trusted-cas', b'buildBundledTrustManager', b'CompositeTrustManager'):
              if token not in dex:
                  print('ERROR: patched code token missing from dex:', token)
                  sys.exit(1)
          print('patched trust-manager code present in dex')
          PY
          openssl x509 -in /tmp/bundled_ca.pem -noout -subject -fingerprint -sha256
          EXPECTED="D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31"
          ACTUAL=$(openssl x509 -in /tmp/bundled_ca.pem -noout -fingerprint -sha256 | sed 's/^[^=]*=//')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: fingerprint mismatch: $ACTUAL"
            exit 1
          fi
          echo "Bundled CA fingerprint verified: $ACTUAL"
          sha256sum app-universal-release.apk

      - name: ci/compute-release-tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
            MAJOR_MINOR=$(echo "$VERSION_NAME" | cut -d. -f1,2)
            PREFIX="patched-v${MAJOR_MINOR}."
            HIGHEST=$(git ls-remote --tags origin "refs/tags/${PREFIX}*" | grep -oP "${PREFIX}\K[0-9]+" | sort -n | tail -1)
            TAG="${PREFIX}$(( ${HIGHEST:--1} + 1 ))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: ci/publish-github-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Patched Mattermost Android build (app-scoped Russian Trusted Root CA).

          Bundles the Russian Trusted Root CA and patches @mattermost/react-native-network-client so the native trust manager additionally trusts certificates under assets/trusted-cas — no system/user CA install required.

          Signed with the debug keystore; uninstall any differently-signed build first." \
            android/app/build/outputs/apk/release/app-universal-release.apk \
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          echo "Published $TAG"
